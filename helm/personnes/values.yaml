# Les noms des services (backend, frontend, postgres) sont fixes : Nginx relaie
# /api vers "http://backend:8080". => une seule release par namespace.

imagePullSecrets: []        # ex. [{ name: ghcr-pull }] pour des images privées GHCR

backend:
  image:
    repository: personnes-backend     # ex. ghcr.io/VOTRE_COMPTE/personnes-backend
    tag: latest
    pullPolicy: IfNotPresent
  # 1 réplique : le schéma est créé par Hibernate (ddl-auto=update)
  replicaCount: 1
  extraEnv: []                        # ex. [{ name: APP_CORS_ALLOWED_ORIGINS, value: "https://..." }]
  resources:
    requests: { cpu: 200m, memory: 384Mi }
    limits: { memory: 768Mi }

frontend:
  image:
    repository: personnes-frontend    # ex. ghcr.io/VOTRE_COMPTE/personnes-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 128Mi }

postgres:
  enabled: true                       # false = utiliser une base externe (externalDatabase.url)
  image: postgres:17
  auth:
    database: personnes
    username: postgres
    password: change-me               # à surcharger : --set postgres.auth.password=...
    existingSecret: ""                # secret existant (clés POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD)
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""                  # vide = classe par défaut du cluster
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

externalDatabase:
  url: ""                             # ex. jdbc:postgresql://host:5432/personnes

monitoring:
  enabled: true
  prometheus:
    image: prom/prometheus:v2.54.1
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 256Mi }
  grafana:
    image: grafana/grafana:11.2.0
    adminUser: admin
    adminPassword: admin
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 256Mi }

ingress:
  enabled: true
  className: nginx
  host: personnes.local
  hostGrafana: grafana.personnes.local
  annotations: {}
  tls:
    enabled: false
    secretName: personnes-tls