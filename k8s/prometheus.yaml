apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: personnes
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'spring-boot-backend'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['backend:8080']
            labels:
              application: 'personnes'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: personnes
  labels: { app: prometheus }
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          ports:
            - containerPort: 9090
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: personnes
spec:
  selector: { app: prometheus }
  ports:
    - port: 9090
      targetPort: 9090
