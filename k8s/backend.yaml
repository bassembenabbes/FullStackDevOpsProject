apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: personnes
  labels: { app: backend }
spec:
  # 1 réplique : le schéma est créé par Hibernate (ddl-auto=update).
  # Pour passer à plusieurs répliques, migrer vers Flyway/Liquibase.
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      securityContext:
        runAsNonRoot: true
      imagePullSecrets:
        - name: ghcr-secret        # ← AJOUTER
      containers:
        - name: backend
          image: ghcr.io/bassembenabbes/personnes-backend:latest  # ← CHANGER : personnes-backend:latest
          imagePullPolicy: Always   # ← CHANGER (car l'image distante peut être mise à jour) IfNotPresent # ← OBLIGATOIRE
          # Sans imagePullPolicy: IfNotPresent, Kubernetes tentera de télécharger personnes-backend:latest depuis Docker Hub et échouera avec ImagePullBackOff.
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/personnes
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: personnes
spec:
  selector: { app: backend }
  ports:
    - port: 8080
      targetPort: 8080
