# Le frontend (Nginx) relaie /api vers le service "backend".
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: personnes
  namespace: personnes
spec:
  ingressClassName: nginx
  rules:
    - host: personnes.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: grafana.personnes.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000