# ⚠ Valeurs d'exemple. En vrai : ne commitez pas de mot de passe réel
# (utilisez Sealed Secrets, External Secrets ou `kubectl create secret`).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: personnes
type: Opaque
stringData:
  POSTGRES_DB: personnes
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: change-me
