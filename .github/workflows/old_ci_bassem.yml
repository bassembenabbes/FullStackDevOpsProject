name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  # Dossier du projet dans le dépôt : "." si le dépôt contient directement backend/ et frontend/
  # Sinon, mettre le sous-dossier, ex. "gestion-personnes"
  PROJECT_DIR: .

jobs:
  backend:
    name: Backend (tests unitaires + intégration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ${{ env.PROJECT_DIR }}/backend/pom.xml
      # Docker est préinstallé sur ubuntu-latest : Testcontainers y lance PostgreSQL
      - name: mvn verify
        run: mvn -B -f "$PROJECT_DIR/backend/pom.xml" verify
      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: ${{ env.PROJECT_DIR }}/backend/target/surefire-reports

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Vite
        working-directory: ${{ env.PROJECT_DIR }}/frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

  docker:
    name: Image ${{ matrix.service }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/personnes-${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}/${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
