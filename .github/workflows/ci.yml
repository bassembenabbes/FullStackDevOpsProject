name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  PROJECT_DIR: .               # "." si backend/ frontend/ helm/ sont a la racine du depot
  AWS_REGION: us-east-1
  ECS_CLUSTER: personnes
  # Build + push + deploiement uniquement sur un push vers main
  IS_DEPLOY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (tests unitaires + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ${{ env.PROJECT_DIR }}/backend/pom.xml
      - name: mvn verify
        run: mvn -B -f "$PROJECT_DIR/backend/pom.xml" verify
      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: ${{ env.PROJECT_DIR }}/backend/target/surefire-reports

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Vite
        working-directory: ${{ env.PROJECT_DIR }}/frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

  helm:
    name: Chart Helm (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint "$PROJECT_DIR/helm/personnes"
      - run: helm template personnes "$PROJECT_DIR/helm/personnes" -n personnes > /dev/null

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform fmt
        working-directory: ${{ env.PROJECT_DIR }}/terraform
        run: terraform fmt -check -diff
      - name: Terraform init
        working-directory: ${{ env.PROJECT_DIR }}/terraform
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: ${{ env.PROJECT_DIR }}/terraform
        run: terraform validate

  images:
    name: Image ${{ matrix.service }} (build + push ECR et GHCR)
    needs: [backend, frontend, helm, terraform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write           # necessaire a l'authentification OIDC
      packages: write           # push vers GHCR
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Authentification AWS (OIDC)
        if: env.IS_DEPLOY == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connexion a ECR
        id: ecr
        if: env.IS_DEPLOY == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Connexion a GHCR
        if: env.IS_DEPLOY == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build (et push sur main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}/${{ matrix.service }}
          push: ${{ env.IS_DEPLOY == 'true' }}
          tags: |
            ${{ steps.ecr.outputs.registry || 'local' }}/personnes-${{ matrix.service }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry || 'local' }}/personnes-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/personnes-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/personnes-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploiement ECS
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-aws
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authentification AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Redeployer les services (nouvelle image :latest)
        run: |
          for svc in backend frontend; do
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$svc" \
              --force-new-deployment --no-cli-pager > /dev/null
          done

      - name: Attendre la stabilite des services
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services backend frontend

      - name: URL de l'application
        run: |
          DNS=$(aws elbv2 describe-load-balancers --names personnes-alb \
            --query 'LoadBalancers[0].DNSName' --output text)
          echo "### Deploye : http://$DNS" >> "$GITHUB_STEP_SUMMARY"